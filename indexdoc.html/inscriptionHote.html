<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeLink-Inscription</title>
</head>
<body>
    <div class="hom">
        <img src="/logo/logo.png" alt="">

        <input type="text" placeholder="Nom et Prenom de l’hôte" name="" id="">
